spring.application.name=saloris-backend

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5433/saloris_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway database migrations
spring.flyway.enabled=true

saloris.assessment.max-age-hours=24
saloris.assessment.required-indicators=HEART_RATE,SYSTOLIC_BLOOD_PRESSURE,DIASTOLIC_BLOOD_PRESSURE,BLOOD_GLUCOSE,BODY_TEMPERATURE
